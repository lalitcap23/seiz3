[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# No global solc pin: real Morpho Blue (=0.8.19) and the v4 PoolManager (=0.8.26) are compiled
# as test artifacts and deployed with `deployCode`. Our own sources stay on 0.8.28 (transient storage).
compilation_restrictions = [{ paths = "src/**", version = "=0.8.28" }]
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
fs_permissions = [{ access = "read-write", path = "../deployments" }, { access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 64
depth = 500

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[lint]
lint_on_build = false        # run `forge lint` explicitly; Core unit casts are noisy
