packages:
  - "packages/*"

# slow networks (venue Wi-Fi, Docker builds): large tarballs such as @next/swc and viem outlast the 60 s default
fetchTimeout: 600000
fetchRetries: 5

# pnpm 11 blocks dependency build scripts unless allowlisted
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# @chainlink/cre-sdk's cre-compile imports the TypeScript 5 compiler API but only lists it as a devDependency;
# without this it picks up the workspace's hoisted TypeScript 7, which has no JS API
packageExtensions:
  "@chainlink/cre-sdk@1":
    dependencies:
      typescript: "5.9.3"
