[profile.default]
src = "src"
test = "test"
libs = ["lib"]
out = "out"
cache_path = "cache"
solc_version = "0.8.28"
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [
  { access = "read-write", path = "./shared" },
  { access = "read-write", path = "/shared" },
]

[fmt]
line_length = 110
tab_width = 4
