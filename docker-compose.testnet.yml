# The whole testnet demo in one command: risk engine, keeper, API (faucet + presenter replay), bots and the web app.
#
#   pnpm testnet:up      # docker compose -f docker-compose.testnet.yml up -d --build
#   pnpm testnet:logs    # follow every service
#   pnpm testnet:down
#
# Then http://localhost:3000 (dashboard) and http://localhost:3000/try (testers). API on http://localhost:8787.
#
# Keys come straight from .env.local: DEPLOYER_PRIVATE_KEY, KEEPER_PRIVATE_KEY, FAUCET_OPERATOR_PRIVATE_KEY,
# HL_MM_PRIVATE_KEY + HL_MM_ACCOUNT, RPC_URL (private, e.g. Alchemy; the public one rate-limits ~100 requests a minute
# per IP). Optional there: REPLAY_TOKEN (turns the presenter bar on), ALERT_WEBHOOK_URL.
# eth_getLogs: Alchemy's free tier serves 10 blocks a call, so the API reads new blocks there (same head as its
# snapshot) and only loads history through thirdweb's keyless RPC (LOGS_RPC_URL), which rate-limits most calls; the
# keeper's borrower scan uses thirdweb too. The public RPC rate-limits this IP along with the browser and the wallet.
# deployments/ is shared with the host: testnet.json, the keeper's KILL switch, the bots' BOTS_HOLD, the API's
# feed-cache.testnet.json (scanned history, so a restart doesn't reload it).
name: afterbell-testnet

x-logs-rpc: &logs-rpc https://998.rpc.thirdweb.com

x-service: &service
  build:
    context: .
    dockerfile: docker/services.Dockerfile
  image: afterbell-services:testnet
  restart: unless-stopped
  env_file: .env.local
  volumes:
    - ./deployments:/app/deployments

services:
  risk-engine:
    <<: *service
    command: ["pnpm", "--filter", "@afterbell/keeper", "risk-engine:stub"]
    environment:
      RISK_ENGINE_PORT: "8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30

  keeper:
    <<: *service
    depends_on:
      risk-engine:
        condition: service_healthy
    # .env.local names the key KEEPER_PRIVATE_KEY; the keeper reads KEEPER_PK and needs an explicit RPC_URL
    command:
      - sh
      - -c
      - KEEPER_PK=$$KEEPER_PRIVATE_KEY RPC_URL=$${RPC_URL:-https://rpc.hyperliquid-testnet.xyz/evm} exec pnpm --filter @afterbell/keeper start
    environment:
      DEPLOYMENTS_PATH: /app/deployments/testnet.json
      KILL_SWITCH_FILE: /app/deployments/KILL
      RISK_ENGINE_URL: http://risk-engine:8081
      MORPHO_API_ENABLED: "0" # Morpho's API doesn't index our own Morpho copy
      IDLE_RESERVE_USDC: "1000000000" # never top up: testnet's CoreDepositWallet loses the deposit
      TICK_MS: "2000"
      LOGS_RPC_URL: *logs-rpc
      # /try and the faucet also put testers on deployments/watch.json, read every tick
      BORROWER_SCAN_PAGES_PER_TICK: "2" # new blocks first, then backfill
      BORROWER_SCAN_INTERVAL_MS: "4000"
      # buy-back liquidity gate: no unwind until HyperCore has an ask for the buy-back (the bots post it on request)
      HL_INFO_API_URL: https://api.hyperliquid-testnet.xyz/info
      # 2026-10-29 session start: thirdweb serves 1000 blocks a call and rate-limits, so a backfill from the vault's
      # deploy (68013191) took 20+ min. Testers who connect on /try are watched through watch.json regardless.
      BORROWER_SCAN_FROM_BLOCK: "68197000"

  api:
    <<: *service
    command: ["pnpm", "--filter", "@afterbell/api", "start"]
    ports: ["8787:8787"]
    environment:
      NETWORK: testnet
      FROM_BLOCK: "68197000" # activity feed from the 2026-10-29 session (the vault's deploy, 68013191, is 185k blocks back)
      LOGS_RPC_URL: *logs-rpc # history only; new blocks come from RPC_URL
      LOG_PAGE: "1000" # thirdweb's cap
      LOG_SCAN_MS: "1000" # between history calls; a rate limit backs off up to 30 s
      KILL_SWITCH_FILE: /app/deployments/KILL
      HOLD_FILE: /app/deployments/BOTS_HOLD
      # Docker Desktop shows every local request as one IP, so the per-IP limit would allow one drip an hour in
      # total. The faucet's own once-a-day-per-address limit still holds. Public behind a proxy: 3600 + TRUST_PROXY=1.
      FAUCET_IP_COOLDOWN_SEC: "0"

  bots:
    <<: *service
    depends_on: [api]
    command: ["pnpm", "--filter", "@afterbell/bots", "start"]
    environment:
      NETWORK: testnet
      BOTS: oracle,pool,mm,alerts
      HOLD_FILE: /app/deployments/BOTS_HOLD
      # the rebalancer recycles the deployer's own LP shares (it owns the vault); keep ~3 tester liquidations of cash
      VAULT_FLOOR_USDC: "60"
      USDC_TOPUP: "30"
      # the market maker's account holds ~$236 against a ~2 NVDA short (liq. ~$330), so the default 8% distance holds;
      # 6 NVDA of short covers 5–10 back-to-back tester unwinds before its own bids buy it back
      MM_VAULT_MAX_SHORT: "6"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8787 # the API as the browser reaches it
        NEXT_PUBLIC_NETWORK: testnet
    image: afterbell-web:testnet
    restart: unless-stopped
    depends_on: [api]
    ports: ["${WEB_PORT:-3000}:3000"] # WEB_PORT=3001 pnpm testnet:up when 3000 is taken
