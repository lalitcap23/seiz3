name: afterbell

services:
  risk-engine:
    build:
      context: .
      dockerfile: docker/keeper.Dockerfile
    image: afterbell-keeper:local
    command: ["pnpm", "--filter", "@afterbell/keeper", "risk-engine:stub"]
    environment:
      RISK_ENGINE_PORT: "8081"
    ports:
      - "8081:8081"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 30

  keeper:
    image: afterbell-keeper:local
    profiles: ["demo"]
    depends_on:
      risk-engine:
        condition: service_healthy
    environment:
      RPC_URL: ${RPC_URL:?set RPC_URL to an external node}
      KEEPER_PK: ${KEEPER_PK:-0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d}
      DEPLOYMENTS_PATH: /shared/${NETWORK:-testnet}.json
      RISK_ENGINE_URL: http://risk-engine:8081
      TICK_MS: "500"
      HEALTH_PORT: "9090"
      DRY_RUN: "false"
    volumes:
      - ./deployments:/shared:ro
    ports:
      - "9090:9090"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9090/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped
